name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view syntax
        run: node --check views/setup/app.js
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs

  release_v091:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.9.1 default agent chat path, probe passthrough and guardrail hardening'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 0.9.1' metadata.yaml
          grep -Fx 'PLUGIN_VERSION = "0.9.1"' agy_provider/_version.py
          asset=astrbot_plugin_antigravity_acp_v0.9.1.zip
          git archive --format=zip --prefix=astrbot_plugin_antigravity_acp/ -o "$asset" "$GITHUB_SHA"
          unzip -t "$asset"
          for f in index.html app.js style.css; do unzip -Z1 "$asset" | grep -Fx "astrbot_plugin_antigravity_acp/views/setup/$f"; done
          if unzip -Z1 "$asset" | grep -E '/views/setup/assets/|/frontend/|/tests/|/docs/'; then exit 1; fi
          cat > /tmp/v091-notes.md <<'NOTES'
          ## v0.9.1 — 纯聊天改用默认 Agent、自检透传与护栏加固（#52 · #53 / #54）

          - 自 Antigravity CLI `1.5.17` 起自定义 Agent（`--agent`）按 4 倍速率消耗 Gemini 额度。纯聊天、禁用工具、`tool_choice=none`、无工具收尾与自检不再生成 `astrbot-chat.md` 或传入 `--agent astrbot-chat`，统一改用默认 Agent 并把人设与无工具护栏写入 `workspace/AGENTS.md`。
          - 自检同步透传 `agy_customizations_mode`，旧 CLI 开 `minimal` 时自检即阻断；无工具会话遇到未登记内置工具补齐 `no_retry`/`no_fallback`；拒止文案不再向纯聊天用户建议切换模式；护栏补齐全部声明工具及 `read_url`/`execute_url`/`swarm` 等禁令。
          - 注意：默认 Agent 会向模型声明内置工具，纯聊天对 `search_web` 等免事前审批工具改为依赖护栏 + 事后中止，不再有旧版 `tools: []` 的声明级隔离。

          [Issue #52](https://github.com/sl251/astrbot_plugin_antigravity_acp/issues/52) · [PR #53](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/53) · [PR #54](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/54) · 完整记录见 [CHANGELOG.md](https://github.com/sl251/astrbot_plugin_antigravity_acp/blob/v0.9.1/CHANGELOG.md)

          PR #53 与 PR #54 的 Ubuntu/Windows × Python 3.11/3.12 CI 全部通过；合并后离线回归 Python 394 项（17 项按平台跳过）与 Node 47 项通过。PR 记载 Linux Docker / AstrBot 4.29.4 / 官方 CLI `1.5.19` 实机：`inherit` 与 `minimal` 自检通过、纯聊天两轮会话复用、护栏拒绝 `run_command`/`search_web`、宿主 `AGENTS.md` 未穿透。未验证：单账号精确额度倍率 A/B（沿用上游 #1890）；webchat / QQ 多轮长对话；Windows、macOS 实机。支持 AstrBot >=4.29.4,<4.30、Python 3.11+；无数据迁移，可回退 v0.9.0。
          NOTES
          printf '\nCI: %s/%s/actions/runs/%s\n\nSHA-256: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sha256sum "$asset" | cut -d' ' -f1)" >> /tmp/v091-notes.md
          gh release create v0.9.1 "$asset" --target "$GITHUB_SHA" --title "v0.9.1" --notes-file /tmp/v091-notes.md --latest
