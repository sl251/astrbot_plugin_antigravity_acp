name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sensitive pattern scan
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_sensitive.py
      - name: Byte-compile all plugin sources
        run: python -B -m compileall -q main.py agy_provider tests
      - name: Offline Python regressions
        run: python -m unittest discover -s tests -v
      - name: Setup view syntax
        run: node --check views/setup/app.js
      - name: Setup view interaction regressions
        run: node --test tests/setup.test.mjs

  release_v090:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.9.0 tool-image continuation, MCP image results and turn history panel'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 0.9.0' metadata.yaml
          grep -Fx 'PLUGIN_VERSION = "0.9.0"' agy_provider/_version.py
          asset=astrbot_plugin_antigravity_acp_v0.9.0.zip
          git archive --format=zip --prefix=astrbot_plugin_antigravity_acp/ -o "$asset" "$GITHUB_SHA"
          unzip -t "$asset"
          for f in index.html app.js style.css; do unzip -Z1 "$asset" | grep -Fx "astrbot_plugin_antigravity_acp/views/setup/$f"; done
          if unzip -Z1 "$asset" | grep -E '/views/setup/assets/|/frontend/|/tests/|/docs/'; then exit 1; fi
          cat > /tmp/v090-notes.md <<'NOTES'
          ## v0.9.0 — 带图工具结果续轮、MCP 图片回传与历史调用记录面板（#48 / #49 · #51）

          - 工具返回图片后，宿主会在工具结果后再追加一条图片消息。旧版把它当作被改写的历史并抛 `TOOL_HISTORY`，整轮切到 fallback，用户收到与图片无关的回复；现在带图续轮正常完成，标注与缓存路径仍须逐一匹配，不匹配照旧拒绝。
          - 工具结果里的图片经 MCP `tools/call` 的 `image` 块交给官方 CLI；CLI 不支持图片时只送文本。同步修正续轮判定、同图去重配对，并保留迟到结果拦截。
          - 每日用量热力图修复悬停抽动与月标重叠；监控页新增可折叠「历史调用记录」面板，展开时按需读取新增只读接口 `GET monitor/turns`（管理员鉴权、脱敏、不触发模型请求）。
          - 升级须知：`media_roots` 需包含宿主落盘图片的目录（Docker 默认 `/AstrBot/data/temp`），否则自动附图等本地图片会报 `IMAGE_PATH` 并整轮 fallback。

          [Issue #48](https://github.com/sl251/astrbot_plugin_antigravity_acp/issues/48) · [PR #49](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/49) · [PR #51](https://github.com/sl251/astrbot_plugin_antigravity_acp/pull/51) · 完整记录见 [CHANGELOG.md](https://github.com/sl251/astrbot_plugin_antigravity_acp/blob/v0.9.0/CHANGELOG.md)

          PR #49 与 PR #51 的 Ubuntu/Windows × Python 3.11/3.12 CI 全部通过；合并后离线回归 Python 389 项（17 项按平台跳过）与 Node 47 项通过。#49 的运行时代码已在 Linux Docker / AstrBot 4.29.4 / 官方 CLI 实机以 webchat 复现并确认修复。未验证：工具真正返回图片时 MCP `image` 块送达 CLI 的路径（仅离线覆盖）；#51 的接口与面板未在实机验收；Windows、macOS 与 AstrBot 4.30。支持 AstrBot >=4.29.4,<4.30、Python 3.11+；无数据迁移，可回退 v0.8.6。
          NOTES
          printf '\nCI: %s/%s/actions/runs/%s\n\nSHA-256: %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(sha256sum "$asset" | cut -d' ' -f1)" >> /tmp/v090-notes.md
          gh release create v0.9.0 "$asset" --target "$GITHUB_SHA" --title "v0.9.0" --notes-file /tmp/v090-notes.md --latest
