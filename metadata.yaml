name: astrbot_plugin_antigravity_acp
display_name: Antigravity ACP
short_desc: 免反代：官方 AGY CLI 直连，把 Gemini 用作 AstrBot 主模型
desc: 免反代、免 API Key：通过官方 Antigravity CLI（agy）和 ACP 协议把 Gemini 接入 AstrBot。安装后可在侧边栏或插件详情的「Antigravity ACP」面板检测环境、完成官方登录、选择并启用模型；支持思考档位、原生工具与图片输入。需在 AstrBot 实际运行环境安装官方 CLI。
